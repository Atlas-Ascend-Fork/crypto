minimum_pre_commit_version: 4.0.0
# LICENSE：许可证全文不得变更，含行尾空格
# .gitcode：门禁流水线配置，由基础设施团队评审
exclude: ^LICENSES/|(^|/)LICENSE$|^\.gitcode/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # C++ 代码格式化检查，.asc 为 Ascend C kernel 源文件
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|asc)$
        args:
          - "--style=file"
          - "--verbose"
          - "-i"
        exclude: ^build/|tests/third_party/

  # Python 代码检查
  # 不启用 ruff-format：它按 PEP 8 在复杂切片冒号两侧加空格，
  # 与 CANN 的 G.FMT.04 冲突，会产生 CodeCheck 告警，且该行为不可配置
  # F401：算子包的 __init__.py 通过 import 触发扩展注册，不能按未使用删除
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix", "--ignore", "F401"]
        types: [python]

  # 拼写检查，Fo 为 MSVC 编译器目标文件参数 /Fo，非拼写错误
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,nd,tbe,copyin,alog,Fo",
            "--skip",
            "*.py,*.cpp,*.hpp,*.c,*.h",
          ]

  # OAT 合规性检查 (Open Source Audit Tool)
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: true
        require_serial: true
        types: [file]
        stages: [pre-commit]
        verbose: true
